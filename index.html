<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmos JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <span class="tag">PROGRAMAÇÃO</span>
            <h1>Algoritmos JavaScript</h1>
            <p>Execute os algoritmos desenvolvidos na atividade.</p>
        </div>
    </header>

    <main>

        <section class="algoritmos">
            <button class="algoritmo ativo" onclick="selecionarAlgoritmo('primo', this)">
                <span>01</span>
                <strong>Número Primo</strong>
                <small>Verificar se um número é primo</small>
            </button>

            <button class="algoritmo" onclick="selecionarAlgoritmo('somatorio', this)">
                <span>02</span>
                <strong>Somatório</strong>
                <small>Somar os valores de um conjunto</small>
            </button>

            <button class="algoritmo" onclick="selecionarAlgoritmo('fibonacci', this)">
                <span>03</span>
                <strong>Fibonacci</strong>
                <small>Gerar a sequência de Fibonacci</small>
            </button>

            <button class="algoritmo" onclick="selecionarAlgoritmo('mdc', this)">
                <span>04</span>
                <strong>MDC</strong>
                <small>Calcular o máximo divisor comum</small>
            </button>

            <button class="algoritmo" onclick="selecionarAlgoritmo('quicksort', this)">
                <span>05</span>
                <strong>Quicksort</strong>
                <small>Ordenar um conjunto de números</small>
            </button>

            <button class="algoritmo" onclick="selecionarAlgoritmo('contagem', this)">
                <span>06</span>
                <strong>Contagem</strong>
                <small>Contar números inteiros</small>
            </button>
        </section>

        <section class="painel">

            <div class="painel-topo">
                <div>
                    <span class="tag">ALGORITMO SELECIONADO</span>
                    <h2 id="tituloAlgoritmo">Número Primo</h2>
                </div>
                <div class="numero-algoritmo" id="numeroAlgoritmo">01</div>
            </div>

            <div id="formulario"></div>

            <div id="resultado" class="resultado">
                <span class="resultado-label">RESULTADO</span>
                <p>Preencha os dados e execute o algoritmo.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Projeto de Algoritmos • JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
